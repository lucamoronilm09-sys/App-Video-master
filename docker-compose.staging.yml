# Docker Compose per AI Video Maker - Configurazione Staging
# Utilizzo: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# 
# Caratteristiche staging:
# - Simula production ma con logging più dettagliato
# - Dati persistenti separati da production
# - Utile per test pre-deploy e QA
# - CORS configurato per dominio di staging

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: app-video-backend-staging
    ports:
      - "8000:8000"
    volumes:
      # Volume persistente separato per staging
      - app-staging-data:/app/data:rw
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=staging
      - LOG_LEVEL=DEBUG  # Più dettagliato per debug in staging
      - NODE_ENV=production
      # CORS specifico per staging
      # - CORS_ORIGINS=https://staging.example.com
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Resource limits ridotti rispetto a production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: app-video-frontend-staging
    ports:
      - "3000:3000"
    volumes:
      - frontend-staging-cache:/app/.next/cache:rw
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  app-network:
    driver: bridge

volumes:
  # Named volumes separati per staging
  app-staging-data:
    driver: local
  frontend-staging-cache:
    driver: local
