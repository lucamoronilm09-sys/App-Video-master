# Docker Compose per AI Video Maker - Configurazione Testing
# Utilizzo: docker compose -f docker-compose.yml -f docker-compose.test.yml up
# 
# Caratteristiche testing:
# - Isolamento completo
# - Logging dettagliato per debug
# - Nessuna persistenza dati (volumi temporanei)
# - API URL interna per test end-to-end

services:
  backend:
    container_name: app-video-backend-test
    environment:
      - APP_ENV=testing
      - LOG_LEVEL=DEBUG
      - NODE_ENV=test
      - DATA_DIR=/app/data
    volumes:
      # Volume temporaneo per i dati di test
      - test-data:/app/data:rw
    # Override command per testing se necessario
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    container_name: app-video-frontend-test
    environment:
      - NODE_ENV=test
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    # Nessun volume mount per testing - usa immagine buildata

# Volumi temporanei per testing (non persistenti)
volumes:
  test-data:
    driver: local
