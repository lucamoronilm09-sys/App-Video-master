version: '3.8'

# Docker Compose per AI Video Maker - Configurazione Development
# Utilizzo: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# 
# Caratteristiche development:
# - Mount del codice sorgente per hot-reload
# - Debug logging abilitato
# - CORS per localhost
# - Nessuna ottimizzazione di produzione

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base  # Usa lo stage base per sviluppo
    container_name: app-video-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount del codice sorgente per hot-reload
      - ./backend:/app
      # Volume persistente per i dati dei progetti
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Debug mode: reload automatico
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # Usa lo stage development
    container_name: app-video-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount del codice sorgente per hot-reload
      - ./frontend:/app
      # Evita di sovrascrivere node_modules e .next nel container
      - /app/node_modules
      - /app/.next/cache
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app-network:
    driver: bridge
