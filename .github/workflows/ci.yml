name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pip-tools
        run: python -m pip install pip-tools
      - name: Install backend dependencies (pinned versions)
        run: python -m pip install -r backend/requirements.txt
      - name: Verify requirements.in compiles correctly
        run: cd backend && pip-compile requirements.in --output-file requirements.txt --dry-run
      - name: Run backend tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: docker build -t app-video-backend ./backend
      
      - name: Build frontend Docker image
        run: docker build -t app-video-frontend ./frontend
      
      - name: Verify docker-compose configuration
        run: docker-compose config
